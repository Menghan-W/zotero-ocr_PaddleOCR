name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  manual-release:
    name: Create Manual Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Validate version format
        run: |
          if ! echo "${{ github.event.inputs.version }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.0.1)"
            exit 1
          fi
      
      - name: Check if tag exists
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Error: Tag v${{ github.event.inputs.version }} already exists"
            exit 1
          fi
      
      - name: Update version in manifest.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          perl -pi -e "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src/manifest.json
          
          # Also update install.rdf if it exists
          if [ -f src/install.rdf ]; then
            perl -pi -e "s/em:version=\"[^\"]*/em:version=\"$VERSION/;" src/install.rdf
          fi
      
      - name: Update pixi.toml version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          perl -pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" pixi.toml
      
      - name: Build XPI package
        run: |
          ./build.sh ${{ github.event.inputs.version }}
      
      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          echo "## Release v${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "Zotero OCR plugin with PaddleOCR support" >> release_notes.md
          echo "" >> release_notes.md
          
          # Add recent commits
          echo "### Recent Changes:" >> release_notes.md
          git log -10 --pretty=format:"- %s (%h)" >> release_notes.md
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Option 1: Using Pixi (Recommended)" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pixi install" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### Option 2: Manual Installation" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "pip install paddleocr img2pdf" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "See [INSTALL.md](https://github.com/Menghan-W/zotero-ocr_PaddleOCR/blob/main/INSTALL.md) for detailed instructions." >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Documentation:** [README.md](https://github.com/Menghan-W/zotero-ocr_PaddleOCR/blob/main/README.md)" >> release_notes.md
      
      - name: Update updates.json
        run: |
          VERSION="${{ github.event.inputs.version }}"
          XPI_FILE="build/zotero-ocr-${VERSION}.xpi"
          
          # Calculate SHA256 hash
          HASH=$(shasum -a 256 "$XPI_FILE" | cut -d' ' -f1)
          
          # Update updates.json
          perl -pi -e "s/\"version\": \"[^\"]*\",/\"version\": \"${VERSION}\",/" updates.json
          perl -pi -e "s|\"update_link\": \"[^\"]*\"|\"update_link\": \"https://github.com/Menghan-W/zotero-ocr_PaddleOCR/releases/download/v${VERSION}/zotero-ocr-${VERSION}.xpi\"|" updates.json
          
          # Update or add update_hash
          if grep -q "update_hash" updates.json; then
            perl -pi -e "s/\"update_hash\": \"[^\"]*\"/\"update_hash\": \"sha256:${HASH}\"/" updates.json
          fi
      
      - name: Commit version changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/manifest.json pixi.toml updates.json
          
          if [ -f src/install.rdf ]; then
            git add src/install.rdf
          fi
          
          git commit -m "Release v${{ github.event.inputs.version }}"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
      
      - name: Push changes and tag
        run: |
          git push origin HEAD:main || git push origin HEAD:master
          git push origin "v${{ github.event.inputs.version }}"
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ github.event.inputs.version }}
          tag_name: v${{ github.event.inputs.version }}
          body_path: release_notes.md
          files: |
            build/zotero-ocr-${{ github.event.inputs.version }}.xpi
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
